# Local stack in one command: the API + Prometheus (+ Grafana, optional).
#   docker compose up --build                     -> API + Prometheus
#   docker compose --profile grafana up --build   -> API + Prometheus + Grafana
services:

  api:
    build: .                              # build the image from ./Dockerfile
    image: neural-rerank-engine:local     # name given to the built image
    ports:
      - "8000:8000"                       # host port 8000 -> container port 8000
    environment:
      TOP_K: "50"                         # number of candidates sent to the reranker
    restart: unless-stopped               # restart the container if it crashes

  prometheus:
    image: prom/prometheus:v3.14.0        # official image, pinned version
    volumes:
      # mount our config file (read-only) where Prometheus expects it
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"                       # Prometheus UI: http://localhost:9090
    depends_on:
      - api                               # start the API first

  grafana:
    image: grafana/grafana:13.1.8         # official image, pinned version
    profiles: ["grafana"]                 # only started with --profile grafana
    volumes:
      # auto-configure Prometheus as a data source
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    ports:
      - "3000:3000"                       # Grafana UI: http://localhost:3000 (admin / admin)
    depends_on:
      - prometheus
