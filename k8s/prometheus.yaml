# Minimal Prometheus inside the cluster, to scrape the API pods.
# It discovers pods through the Kubernetes API and keeps the ones annotated
# with prometheus.io/scrape: "true" (see deployment.yaml).
# UI: kubectl port-forward service/prometheus 9090:9090  ->  http://localhost:9090

# --- Identity of Prometheus inside the cluster
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
# --- Permission to list/watch pods (needed for service discovery)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
# --- Give that permission to the ServiceAccount above
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: default
---
# --- Prometheus configuration file, stored in a ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod                       # list every pod of the cluster
        relabel_configs:
          # keep only pods annotated prometheus.io/scrape: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # use the prometheus.io/path annotation as the metrics path
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # scrape <pod IP>:<prometheus.io/port>
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          # add the pod name as a label, to see each pod separately
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
---
# --- The Prometheus server itself (1 pod)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus      # use the permissions defined above
      containers:
        - name: prometheus
          image: prom/prometheus:v3.14.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
          volumeMounts:
            - name: config                # the ConfigMap, mounted as a file
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
# --- Stable address for the Prometheus UI
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
